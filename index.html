<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f6e56">
<title>まなびログ</title>
<style>
  :root{
    --bg:#faf9f5; --surface:#ffffff; --surface-2:#f1efe8;
    --text:#2c2c2a; --muted:#6b6a63; --hint:#9a988f;
    --border:#e5e3da; --border-strong:#d3d1c7;
    --accent:#0f6e56; --accent-soft:#e1f5ee;
    --warn:#854f0b; --warn-soft:#faeeda;
    --radius:12px;
    --c0:#eeece3; --c1:#9fe1cb; --c2:#1d9e75; --c3:#0f6e56;
    --shadow:0 1px 3px rgba(0,0,0,.05);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1a1a18; --surface:#26251f; --surface-2:#302f28;
      --text:#eceae2; --muted:#a8a69c; --hint:#78766d;
      --border:#3a382f; --border-strong:#4a473c;
      --accent:#5dcaa5; --accent-soft:#123b30;
      --warn:#f0b757; --warn-soft:#3a2c12;
      --c0:#2f2e26; --c1:#0f6e56; --c2:#1d9e75; --c3:#5dcaa5;
    }
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:var(--sans); background:var(--bg); color:var(--text);
    line-height:1.6; -webkit-font-smoothing:antialiased;
    padding:0 0 80px; max-width:720px; margin:0 auto;
  }
  header{
    padding:20px 18px 14px; display:flex; align-items:center; justify-content:space-between;
    gap:12px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .logo{
    width:38px; height:38px; border-radius:10px; background:var(--accent-soft);
    display:flex; align-items:center; justify-content:center; font-size:20px;
  }
  .brand h1{font-size:18px; font-weight:600; letter-spacing:.01em;}
  .brand .date{font-size:12px; color:var(--hint); font-weight:400;}
  .streak{
    display:flex; align-items:center; gap:6px; background:var(--warn-soft);
    color:var(--warn); padding:7px 14px; border-radius:20px; font-size:13px; font-weight:600;
  }
  .streak.zero{background:var(--surface-2); color:var(--muted);}
  section{padding:0 18px; margin-bottom:20px;}
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .stat{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px;}
  .stat .label{font-size:11px; color:var(--hint); margin-bottom:2px;}
  .stat .val{font-size:23px; font-weight:600; line-height:1.2;}
  .stat .val small{font-size:12px; color:var(--muted); font-weight:400; margin-left:2px;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow);}
  .card-title{font-size:13px; color:var(--muted); margin-bottom:12px; display:flex; align-items:center; justify-content:space-between;}
  /* heatmap */
  #heat{display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,1fr); gap:3px; overflow-x:auto; padding-bottom:2px;}
  .cell{width:100%; aspect-ratio:1; min-width:11px; border-radius:3px; background:var(--c0);}
  .cell.l1{background:var(--c1);} .cell.l2{background:var(--c2);} .cell.l3{background:var(--c3);}
  .cell.today{outline:2px solid var(--accent); outline-offset:1px;}
  .heat-legend{display:flex; align-items:center; justify-content:flex-end; gap:5px; margin-top:9px; font-size:11px; color:var(--hint);}
  .heat-legend .cell{width:11px; height:11px; aspect-ratio:auto; flex:none;}
  /* goal bar */
  .goal-row{display:flex; align-items:center; gap:10px; font-size:13px;}
  .goal-track{flex:1; height:8px; background:var(--surface-2); border-radius:6px; overflow:hidden;}
  .goal-fill{height:100%; background:var(--accent); border-radius:6px; transition:width .4s ease;}
  .goal-val{color:var(--muted); font-size:12px; white-space:nowrap;}
  /* quick add */
  .chips{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px;}
  .chip{
    font-size:13px; padding:6px 13px; border-radius:18px; cursor:pointer;
    background:var(--surface-2); border:1px solid transparent; color:var(--muted);
    user-select:none; transition:.12s;
  }
  .chip:hover{border-color:var(--border-strong);}
  .chip.on{color:#fff; font-weight:500;}
  .chip.add{background:transparent; border:1px dashed var(--border-strong); color:var(--muted);}
  .chip.add:hover{border-color:var(--accent); color:var(--accent);}
  .manage-link{font-size:12px; color:var(--accent); cursor:pointer; user-select:none; font-weight:400;}
  /* category manager */
  .cat-manager{display:none; background:var(--surface-2); border-radius:10px; padding:12px; margin-bottom:12px;}
  .cat-manager.open{display:block;}
  .cm-list{display:flex; flex-direction:column; gap:2px; margin-bottom:12px;}
  .cm-row{display:flex; align-items:center; gap:10px; padding:6px 4px; font-size:14px;}
  .cm-row .cm-dot{width:11px; height:11px; border-radius:50%; flex:none;}
  .cm-row .cm-name{flex:1;}
  .cm-row .cm-del{font-size:12px; color:var(--hint); cursor:pointer; padding:2px 6px;}
  .cm-row .cm-del:hover{color:#c0392b;}
  .cm-add-name{margin-bottom:8px;}
  .cm-label{font-size:12px; color:var(--muted); margin-bottom:6px;}
  .swatches{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;}
  .swatch{width:24px; height:24px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:.1s;}
  .swatch.on{border-color:var(--text); transform:scale(1.12);}
  .row{display:flex; gap:8px; align-items:center;}
  input[type=text], input[type=number], input[type=date], textarea{
    font-family:inherit; font-size:15px; color:var(--text); background:var(--surface);
    border:1px solid var(--border-strong); border-radius:9px; padding:10px 12px; width:100%;
    outline:none; transition:.12s;
  }
  input:focus, textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  textarea{resize:vertical; min-height:60px; line-height:1.5;}
  .mins{width:92px; flex:none; text-align:center;}
  .presets{display:flex; gap:6px; margin:10px 0;}
  .preset{
    flex:1; font-size:13px; padding:7px 0; text-align:center; border-radius:8px; cursor:pointer;
    background:var(--surface-2); color:var(--muted); border:1px solid transparent; user-select:none; transition:.12s;
  }
  .preset:hover{border-color:var(--border-strong);}
  .preset.on{background:var(--accent-soft); color:var(--accent); font-weight:600; border-color:var(--accent);}
  .feelings{display:flex; gap:8px; margin:10px 0;}
  .feel{
    flex:1; font-size:15px; padding:8px 0; text-align:center; border-radius:8px; cursor:pointer;
    background:var(--surface-2); border:1px solid transparent; color:var(--muted); user-select:none; transition:.12s;
  }
  .feel:hover{border-color:var(--border-strong);}
  .feel.on{background:var(--accent-soft); color:var(--accent); border-color:var(--accent); font-weight:600;}
  .more-toggle{font-size:12px; color:var(--accent); cursor:pointer; margin:6px 0 2px; display:inline-block; user-select:none;}
  .more{display:none; margin-top:10px;}
  .more.open{display:block;}
  .btn{
    font-family:inherit; font-size:15px; font-weight:600; cursor:pointer; border:none;
    background:var(--accent); color:#fff; border-radius:9px; padding:11px 20px; white-space:nowrap;
    transition:.12s;
  }
  .btn:hover{filter:brightness(1.06);}
  .btn:active{transform:scale(.98);}
  .btn.block{width:100%; margin-top:12px;}
  .btn.ghost{background:transparent; color:var(--muted); border:1px solid var(--border-strong); font-weight:500;}
  /* entries */
  .entry{
    display:flex; align-items:flex-start; gap:12px; padding:12px 4px;
    border-bottom:1px solid var(--border);
  }
  .entry:last-child{border-bottom:none;}
  .dot{width:9px; height:9px; border-radius:50%; flex:none; margin-top:6px;}
  .entry .body{flex:1; min-width:0;}
  .entry .t{font-size:15px; word-break:break-word;}
  .entry .meta{font-size:12px; color:var(--hint); margin-top:1px;}
  .entry .memo{font-size:13px; color:var(--muted); margin-top:4px; white-space:pre-wrap; word-break:break-word;}
  .entry .side{display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex:none;}
  .entry .min{font-size:13px; color:var(--muted); white-space:nowrap;}
  .entry .del{font-size:12px; color:var(--hint); cursor:pointer; opacity:0; transition:.12s;}
  .entry:hover .del{opacity:1;}
  .date-head{font-size:12px; color:var(--hint); font-weight:600; margin:16px 0 4px; padding-top:4px;}
  .date-head:first-child{margin-top:0;}
  .empty{text-align:center; color:var(--hint); font-size:14px; padding:30px 0;}
  /* breakdown */
  .brk-row{display:flex; align-items:center; gap:10px; margin-bottom:9px; font-size:13px;}
  .brk-row:last-child{margin-bottom:0;}
  .brk-name{width:88px; flex:none; color:var(--muted);}
  .brk-track{flex:1; height:8px; background:var(--surface-2); border-radius:6px; overflow:hidden;}
  .brk-fill{height:100%; border-radius:6px;}
  .brk-val{width:56px; flex:none; text-align:right; color:var(--muted); font-size:12px;}
  /* footer actions */
  .footer{display:flex; gap:8px; padding:0 18px; margin-top:8px;}
  .footer .btn{flex:1; font-size:13px; padding:9px 0;}
  .hidden{display:none;}
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--text); color:var(--bg); padding:10px 20px; border-radius:22px; font-size:14px;
    opacity:0; transition:.3s; pointer-events:none; z-index:50; box-shadow:0 4px 16px rgba(0,0,0,.2);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">📖</div>
    <div>
      <h1>まなびログ</h1>
      <div class="date" id="today"></div>
    </div>
  </div>
  <div class="streak" id="streak"><span>🔥</span><span id="streakN">0日連続</span></div>
</header>

<section class="stats">
  <div class="stat"><div class="label">今週の合計</div><div class="val" id="s-week">0<small>時間</small></div></div>
  <div class="stat"><div class="label">今月の記録数</div><div class="val" id="s-count">0<small>件</small></div></div>
  <div class="stat"><div class="label">最長連続</div><div class="val" id="s-max">0<small>日</small></div></div>
</section>

<section>
  <div class="card">
    <div class="card-title">
      <span>この3か月の学習カレンダー</span>
      <span id="goal-label" style="font-size:12px;"></span>
    </div>
    <div id="heat"></div>
    <div class="heat-legend">
      少ない
      <span class="cell"></span><span class="cell l1"></span><span class="cell l2"></span><span class="cell l3"></span>
      多い
    </div>
    <div class="goal-row" style="margin-top:14px;">
      <span style="color:var(--muted);">週の目標</span>
      <div class="goal-track"><div class="goal-fill" id="goalFill" style="width:0%"></div></div>
      <span class="goal-val" id="goalVal">0 / 5.0h</span>
    </div>
  </div>
</section>

<section>
  <div class="card">
    <div class="card-title"><span>＋ 今日の学びをさっと記録</span><span class="manage-link" id="manageCats">項目を編集</span></div>
    <div class="cat-manager" id="catManager">
      <div class="cm-list" id="cmList"></div>
      <div class="cm-label">項目を追加</div>
      <input type="text" id="newCatName" class="cm-add-name" placeholder="例：法律・数学・英語" autocomplete="off" maxlength="12">
      <div class="cm-label">色を選ぶ</div>
      <div class="swatches" id="swatches"></div>
      <div class="row">
        <button class="btn" id="addCatBtn" style="flex:1;">この項目を追加</button>
        <button class="btn ghost" id="closeCatBtn" style="flex:none;">閉じる</button>
      </div>
    </div>
    <div class="chips" id="chips"></div>
    <input type="text" id="title" placeholder="何を学んだ？（例：簿記2級 第5章）" autocomplete="off">
    <div class="presets" id="presets">
      <div class="preset" data-m="15">15分</div>
      <div class="preset" data-m="30">30分</div>
      <div class="preset" data-m="45">45分</div>
      <div class="preset" data-m="60">60分</div>
      <div style="flex:none; display:flex; align-items:center;">
        <input type="number" id="mins" class="mins" placeholder="分" min="0" step="5">
      </div>
    </div>
    <span class="more-toggle" id="moreToggle">＋ 手応え・メモ・日付を追加</span>
    <div class="more" id="more">
      <div class="feelings" id="feelings">
        <div class="feel" data-f="◎">◎ バッチリ</div>
        <div class="feel" data-f="○">○ まあまあ</div>
        <div class="feel" data-f="△">△ 難しい</div>
      </div>
      <textarea id="memo" placeholder="気づき・次にやること（任意）"></textarea>
      <div style="margin-top:10px;">
        <label style="font-size:12px; color:var(--muted);">日付</label>
        <input type="date" id="date" style="margin-top:4px;">
      </div>
    </div>
    <button class="btn block" id="save">記録する</button>
  </div>
</section>

<section>
  <div class="card" id="brkCard">
    <div class="card-title"><span>カテゴリ別（今月）</span></div>
    <div id="breakdown"></div>
  </div>
</section>

<section>
  <div class="card-title" style="padding:0 2px;"><span>最近の記録</span><span id="totalRec" style="font-size:12px;"></span></div>
  <div id="entries"></div>
</section>

<div class="footer">
  <button class="btn ghost" id="exportBtn">バックアップ書き出し</button>
  <button class="btn ghost" id="importBtn">読み込み</button>
  <input type="file" id="importFile" accept="application/json" class="hidden">
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ---------- カテゴリ ----------
   初回だけ下の内容で作成されます。以降はアプリ内の「項目を編集」から
   自由に追加・削除でき、その内容が保存されます。 */
const DEFAULT_CATEGORIES = [
  { name:"資格",       color:"#534AB7", order:0 },
  { name:"読書",       color:"#D85A30", order:1 },
  { name:"アプリ開発", color:"#1D9E75", order:2 },
  { name:"仕事スキル", color:"#185FA5", order:3 },
  { name:"その他",     color:"#888780", order:4 },
];
const PALETTE = ["#534AB7","#D85A30","#1D9E75","#185FA5","#993556",
                 "#BA7517","#639922","#0F6E56","#7F77DD","#888780"];
const WEEKLY_GOAL_HOURS = 5;   // 週の目標時間（時間）

let categories = [];   // DBから読み込む
let selSwatch = PALETTE[0];

/* ---------- IndexedDB ---------- */
const DB_NAME = "manabi-log", DB_VER = 2;
let db;
function openDB(){
  return new Promise((res, rej)=>{
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = e=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains("entries")){
        const s = d.createObjectStore("entries", { keyPath:"id" });
        s.createIndex("date", "date");
        s.createIndex("category", "category");
      }
      if(!d.objectStoreNames.contains("cats")){
        d.createObjectStore("cats", { keyPath:"name" });
      }
    };
    r.onsuccess = e=>{ db = e.target.result; res(); };
    r.onerror = e=>rej(e.target.error);
  });
}
function store(name, mode){ return db.transaction(name, mode).objectStore(name); }
function reqP(r){ return new Promise((res, rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }

function getAll(){ return reqP(store("entries","readonly").getAll()).then(r=>r||[]); }
function putEntry(o){ return reqP(store("entries","readwrite").put(o)); }
function delEntry(id){ return reqP(store("entries","readwrite").delete(id)); }

function getAllCats(){ return reqP(store("cats","readonly").getAll()).then(r=>r||[]); }
function putCat(o){ return reqP(store("cats","readwrite").put(o)); }
function delCat(name){ return reqP(store("cats","readwrite").delete(name)); }

/* ---------- 日付ユーティリティ ---------- */
const pad = n=> String(n).padStart(2,"0");
const ymd = d=> `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const WD = ["日","月","火","水","木","金","土"];
function parseYMD(s){ const [y,m,dd]=s.split("-").map(Number); return new Date(y, m-1, dd); }

/* ---------- 状態 ---------- */
let entries = [];
let selCat = "";
let selFeel = "";

/* ---------- 描画 ---------- */
function catColor(name){ const c = categories.find(x=>x.name===name); return c ? c.color : "#888780"; }

function render(){
  renderStats();
  renderHeat();
  renderGoal();
  renderBreakdown();
  renderEntries();
}

function todayStr(){ const d=new Date(); return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`; }

function computeStreak(){
  const days = new Set(entries.map(e=>e.date));
  if(days.size===0) return { current:0, max:0 };
  // current streak: 今日 or 昨日 から連続
  let cur = 0;
  let d = new Date();
  if(!days.has(ymd(d))){ d.setDate(d.getDate()-1); if(!days.has(ymd(d))) cur = 0; }
  if(days.has(ymd(new Date())) || days.has(ymd(d))){
    let cd = days.has(ymd(new Date())) ? new Date() : d;
    while(days.has(ymd(cd))){ cur++; cd.setDate(cd.getDate()-1); }
  }
  // max streak
  const sorted = [...days].sort();
  let max = 0, run = 0, prev = null;
  for(const s of sorted){
    const cur2 = parseYMD(s);
    if(prev){
      const diff = Math.round((cur2 - prev)/86400000);
      run = diff===1 ? run+1 : 1;
    } else run = 1;
    if(run>max) max = run;
    prev = cur2;
  }
  return { current:cur, max };
}

function renderStats(){
  const now = new Date();
  // 今週（月曜始まり）
  const dow = (now.getDay()+6)%7;
  const monday = new Date(now); monday.setDate(now.getDate()-dow); monday.setHours(0,0,0,0);
  let weekMin = 0, monthCount = 0;
  const ym = `${now.getFullYear()}-${pad(now.getMonth()+1)}`;
  for(const e of entries){
    const d = parseYMD(e.date);
    if(d >= monday) weekMin += (e.minutes||0);
    if(e.date.startsWith(ym)) monthCount++;
  }
  document.getElementById("s-week").innerHTML = (weekMin/60).toFixed(1)+"<small>時間</small>";
  document.getElementById("s-count").innerHTML = monthCount+"<small>件</small>";
  const { current, max } = computeStreak();
  document.getElementById("s-max").innerHTML = max+"<small>日</small>";
  const st = document.getElementById("streak");
  document.getElementById("streakN").textContent = current+"日連続";
  st.classList.toggle("zero", current===0);
}

function renderHeat(){
  const heat = document.getElementById("heat");
  heat.innerHTML = "";
  // 直近 ~13週 を月曜始まりで
  const minByDay = {};
  for(const e of entries){ minByDay[e.date] = (minByDay[e.date]||0) + (e.minutes||0); }
  const today = new Date(); today.setHours(0,0,0,0);
  const end = new Date(today);
  // 週の末（日曜）まで埋める
  const startDow = (today.getDay()+6)%7;
  const start = new Date(today); start.setDate(today.getDate()-startDow-12*7);
  const tStr = ymd(today);
  for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
    const key = ymd(d);
    const m = minByDay[key]||0;
    let lvl = 0;
    if(m>0 && m<30) lvl=1; else if(m>=30 && m<60) lvl=2; else if(m>=60) lvl=3;
    const cell = document.createElement("div");
    cell.className = "cell" + (lvl?` l${lvl}`:"") + (key===tStr?" today":"");
    cell.title = `${key}  ${m>0?(m+"分"):"記録なし"}`;
    heat.appendChild(cell);
  }
}

function renderGoal(){
  const now = new Date();
  const dow = (now.getDay()+6)%7;
  const monday = new Date(now); monday.setDate(now.getDate()-dow); monday.setHours(0,0,0,0);
  let weekMin = 0;
  for(const e of entries){ if(parseYMD(e.date) >= monday) weekMin += (e.minutes||0); }
  const h = weekMin/60;
  const pct = Math.min(100, Math.round(h/WEEKLY_GOAL_HOURS*100));
  document.getElementById("goalFill").style.width = pct+"%";
  document.getElementById("goalVal").textContent = `${h.toFixed(1)} / ${WEEKLY_GOAL_HOURS.toFixed(1)}h`;
  document.getElementById("goal-label").textContent = pct>=100 ? "🎉 今週の目標達成！" : "";
}

function renderBreakdown(){
  const now = new Date();
  const ym = `${now.getFullYear()}-${pad(now.getMonth()+1)}`;
  const byCat = {};
  let total = 0;
  for(const e of entries){
    if(!e.date.startsWith(ym)) continue;
    byCat[e.category] = (byCat[e.category]||0) + (e.minutes||0);
    total += (e.minutes||0);
  }
  const box = document.getElementById("breakdown");
  if(total===0){ box.innerHTML = '<div class="empty" style="padding:8px 0;">今月の記録はまだありません</div>'; return; }
  box.innerHTML = "";
  const rows = categories.map(c=>({ name:c.name, color:c.color, min:byCat[c.name]||0 }))
                         .filter(r=>r.min>0).sort((a,b)=>b.min-a.min);
  for(const r of rows){
    const pct = Math.round(r.min/total*100);
    const el = document.createElement("div");
    el.className = "brk-row";
    el.innerHTML = `<span class="brk-name">${r.name}</span>
      <div class="brk-track"><div class="brk-fill" style="width:${pct}%; background:${r.color}"></div></div>
      <span class="brk-val">${(r.min/60).toFixed(1)}h</span>`;
    box.appendChild(el);
  }
}

function feelDot(f){ return f ? `　手応え ${f}` : ""; }

function renderEntries(){
  const box = document.getElementById("entries");
  document.getElementById("totalRec").textContent = entries.length ? `全${entries.length}件` : "";
  if(entries.length===0){
    box.innerHTML = '<div class="empty">まだ記録がありません。<br>今日の学びを1行、書いてみましょう。</div>';
    return;
  }
  const sorted = [...entries].sort((a,b)=> b.date.localeCompare(a.date) || b.createdAt - a.createdAt );
  box.innerHTML = "";
  let curDate = null;
  for(const e of sorted.slice(0, 60)){
    if(e.date !== curDate){
      curDate = e.date;
      const d = parseYMD(e.date);
      const h = document.createElement("div");
      h.className = "date-head";
      const isToday = e.date === ymd(new Date());
      h.textContent = isToday ? "今日" : `${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`;
      box.appendChild(h);
    }
    const row = document.createElement("div");
    row.className = "entry";
    row.innerHTML = `
      <span class="dot" style="background:${catColor(e.category)}"></span>
      <div class="body">
        <div class="t"></div>
        <div class="meta">${e.category}${feelDot(e.feeling)}</div>
        ${e.memo ? `<div class="memo"></div>` : ""}
      </div>
      <div class="side">
        <span class="min">${e.minutes? e.minutes+"分":"—"}</span>
        <span class="del" data-id="${e.id}">削除</span>
      </div>`;
    row.querySelector(".t").textContent = e.title;
    if(e.memo) row.querySelector(".memo").textContent = e.memo;
    box.appendChild(row);
  }
  box.querySelectorAll(".del").forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm("この記録を削除しますか？")) return;
      await delEntry(b.dataset.id);
      entries = entries.filter(x=>x.id!==b.dataset.id);
      render();
      toast("削除しました");
    };
  });
}

/* ---------- 入力UI ---------- */
function buildChips(){
  const box = document.getElementById("chips");
  box.innerHTML = "";
  if(categories.length && !categories.find(c=>c.name===selCat)) selCat = categories[0].name;
  categories.forEach(c=>{
    const el = document.createElement("div");
    el.className = "chip" + (c.name===selCat?" on":"");
    el.textContent = c.name;
    if(c.name===selCat) el.style.background = c.color;
    el.onclick = ()=>{
      selCat = c.name;
      [...box.children].forEach(ch=>{ ch.classList.remove("on"); ch.style.background=""; });
      el.classList.add("on"); el.style.background = c.color;
    };
    box.appendChild(el);
  });
  const add = document.createElement("div");
  add.className = "chip add";
  add.textContent = "＋ 項目を追加";
  add.onclick = ()=> openCatManager(true);
  box.appendChild(add);
}

/* ---------- 項目（カテゴリ）管理 ---------- */
function nextColor(){
  const used = new Set(categories.map(c=>c.color));
  return PALETTE.find(c=>!used.has(c)) || PALETTE[categories.length % PALETTE.length];
}
function buildSwatches(){
  const box = document.getElementById("swatches");
  box.innerHTML = "";
  PALETTE.forEach(col=>{
    const s = document.createElement("div");
    s.className = "swatch" + (col===selSwatch?" on":"");
    s.style.background = col;
    s.onclick = ()=>{
      selSwatch = col;
      [...box.children].forEach(x=>x.classList.remove("on"));
      s.classList.add("on");
    };
    box.appendChild(s);
  });
}
function buildCatList(){
  const box = document.getElementById("cmList");
  box.innerHTML = "";
  categories.forEach(c=>{
    const row = document.createElement("div");
    row.className = "cm-row";
    row.innerHTML = `<span class="cm-dot" style="background:${c.color}"></span>
      <span class="cm-name"></span>
      <span class="cm-del" data-name="${encodeURIComponent(c.name)}">削除</span>`;
    row.querySelector(".cm-name").textContent = c.name;
    box.appendChild(row);
  });
  box.querySelectorAll(".cm-del").forEach(b=>{
    b.onclick = ()=> removeCategory(decodeURIComponent(b.dataset.name));
  });
}
function openCatManager(open){
  const m = document.getElementById("catManager");
  const willOpen = open===undefined ? !m.classList.contains("open") : open;
  m.classList.toggle("open", willOpen);
  if(willOpen){
    selSwatch = nextColor();
    buildCatList();
    buildSwatches();
    document.getElementById("newCatName").value = "";
  }
}
async function addCategory(){
  const input = document.getElementById("newCatName");
  const name = input.value.trim();
  if(!name){ toast("項目名を入力してください"); input.focus(); return; }
  if(categories.find(c=>c.name===name)){ toast("同じ名前の項目があります"); return; }
  const cat = { name, color:selSwatch, order:categories.length };
  await putCat(cat);
  categories.push(cat);
  selCat = name;
  input.value = "";
  buildChips();
  buildCatList();
  selSwatch = nextColor();
  buildSwatches();
  render();
  toast(`「${name}」を追加しました`);
}
async function removeCategory(name){
  if(categories.length<=1){ toast("最後の1項目は削除できません"); return; }
  const used = entries.filter(e=>e.category===name).length;
  const msg = used>0
    ? `「${name}」を削除しますか？\nこの項目の記録${used}件はそのまま残ります（項目名は保持されます）。`
    : `「${name}」を削除しますか？`;
  if(!confirm(msg)) return;
  await delCat(name);
  categories = categories.filter(c=>c.name!==name);
  if(selCat===name) selCat = categories[0].name;
  buildChips();
  buildCatList();
  render();
  toast(`「${name}」を削除しました`);
}

function setupInputs(){
  // presets
  const presets = document.querySelectorAll(".preset");
  const minsInput = document.getElementById("mins");
  presets.forEach(p=>{
    p.onclick = ()=>{
      const on = p.classList.contains("on");
      presets.forEach(x=>x.classList.remove("on"));
      if(!on){ p.classList.add("on"); minsInput.value = p.dataset.m; }
      else minsInput.value = "";
    };
  });
  minsInput.oninput = ()=> presets.forEach(x=>x.classList.remove("on"));
  // feelings
  document.querySelectorAll(".feel").forEach(f=>{
    f.onclick = ()=>{
      if(f.classList.contains("on")){ f.classList.remove("on"); selFeel=""; return; }
      document.querySelectorAll(".feel").forEach(x=>x.classList.remove("on"));
      f.classList.add("on"); selFeel = f.dataset.f;
    };
  });
  // more toggle
  document.getElementById("moreToggle").onclick = ()=>{
    const m = document.getElementById("more");
    const open = m.classList.toggle("open");
    document.getElementById("moreToggle").textContent = open ? "－ 閉じる" : "＋ 手応え・メモ・日付を追加";
  };
  document.getElementById("date").value = ymd(new Date());
  document.getElementById("save").onclick = save;
  // カテゴリ管理
  document.getElementById("manageCats").onclick = ()=> openCatManager();
  document.getElementById("closeCatBtn").onclick = ()=> openCatManager(false);
  document.getElementById("addCatBtn").onclick = addCategory;
  document.getElementById("newCatName").addEventListener("keydown", e=>{
    if(e.key==="Enter"){ e.preventDefault(); addCategory(); }
  });
  // export / import
  document.getElementById("exportBtn").onclick = exportJSON;
  document.getElementById("importBtn").onclick = ()=> document.getElementById("importFile").click();
  document.getElementById("importFile").onchange = importJSON;
}

function resetForm(){
  document.getElementById("title").value = "";
  document.getElementById("mins").value = "";
  document.getElementById("memo").value = "";
  document.querySelectorAll(".preset").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll(".feel").forEach(x=>x.classList.remove("on"));
  selFeel = "";
  document.getElementById("date").value = ymd(new Date());
}

async function save(){
  const title = document.getElementById("title").value.trim();
  if(!title){ toast("内容を入力してください"); document.getElementById("title").focus(); return; }
  const mins = parseInt(document.getElementById("mins").value,10) || 0;
  const date = document.getElementById("date").value || ymd(new Date());
  const obj = {
    id: (Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36)),
    date, category: selCat, title, minutes: mins,
    feeling: selFeel, memo: document.getElementById("memo").value.trim(),
    createdAt: Date.now()
  };
  await putEntry(obj);
  entries.push(obj);
  resetForm();
  render();
  toast("記録しました 🌱");
}

/* ---------- バックアップ ---------- */
function exportJSON(){
  const data = JSON.stringify({ app:"manabi-log", version:1, exportedAt:new Date().toISOString(), entries }, null, 2);
  const blob = new Blob([data], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `manabi-log-${ymd(new Date())}.json`;
  a.click(); URL.revokeObjectURL(url);
  toast("バックアップを書き出しました");
}
function importJSON(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const data = JSON.parse(reader.result);
      const list = Array.isArray(data) ? data : data.entries;
      if(!Array.isArray(list)) throw new Error("形式が違います");
      if(!confirm(`${list.length}件を読み込みます。同じIDは上書きされます。よろしいですか？`)) return;
      for(const e of list){
        if(!e.id) e.id = (Date.now().toString(36)+Math.random().toString(36).slice(2,8));
        await putEntry(e);
      }
      entries = await getAll();
      render();
      toast(`${list.length}件を読み込みました`);
    }catch(err){ toast("読み込みに失敗しました"); }
    ev.target.value = "";
  };
  reader.readAsText(file);
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 1900);
}

/* ---------- 起動 ---------- */
(async function init(){
  document.getElementById("today").textContent = todayStr();
  setupInputs();
  try{
    await openDB();
    categories = await getAllCats();
    if(categories.length === 0){          // 初回：デフォルト項目を作成
      for(const c of DEFAULT_CATEGORIES) await putCat(c);
      categories = DEFAULT_CATEGORIES.slice();
    }
    categories.sort((a,b)=>(a.order||0)-(b.order||0));
    entries = await getAll();
  }catch(err){
    categories = DEFAULT_CATEGORIES.slice();
    toast("データベースを開けませんでした");
  }
  selCat = categories[0] ? categories[0].name : "";
  buildChips();
  render();
  // Enterで保存（内容欄）
  document.getElementById("title").addEventListener("keydown", e=>{
    if(e.key==="Enter"){ e.preventDefault(); save(); }
  });
})();
</script>
